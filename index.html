<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
            text-align: center;
        }
        .container{
            color: aliceblue;
            height: 95vh;
            border: 1px solid black;

        }
        .header,.footer{
            height: 20%;
            background-color: teal;
        }
        .center{
            height: 60%;
            background-color: brown;
            display: flex;
        }
        .left{
            height: 100%;
            width: 30%;
            background-color: coral;
        }
        .right{
            height: 100%;
            width: 70%;
            background-color: yellow;
        }
        .top{
            height: 50%;
            background-color: darkgray;
        }
        .bottam{
            height: 50%;
            background-color: darkblue;
            display: flex;
        }
        .r1{
            height: 100%;
            width: 50%;
            background-color: cadetblue;
        }
        .r2{
            height: 100%;
            width: 50%;
            background-color: cornflowerblue;
        }
    </style>
</head>
<body>
    <h1>FlexBox</h1>
 <div class="container">
    <div class="header"><h1></h1></div>
    <div class="center">
        <div class="left"><h1></h1></div>
        <div class="right">
            <div class="top"><h1></h1></div>
            <div class="bottam">
                <div class="r1"><h1></h1></div>
                <div class="r2"><h1></h1></div>
                </div>
                </div>
                </div>
   <div class="footer"><h1></h1></div>
  </div>
</body>
</html>
